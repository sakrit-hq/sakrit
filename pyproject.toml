[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sakrit"
dynamic = ["version"]
description = "Exactly-once effects for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Sakrit" },
]
keywords = ["ai", "agents", "idempotency", "exactly-once", "durable-execution"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Framework adapters are opt-in extras; the core stays dependency-free.
langgraph = [
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3",
]
openai-agents = [
    # Pre-1.0: minors can break identity derivation — the conformance gate
    # (tests/integration/test_openai_agents_conformance.py) is the adoption check.
    "openai-agents>=0.18,<1.0",
]

[project.scripts]
sakrit = "sakrit.cli:main"

# NOTE: repo will move to a `sakrit` GitHub org soon (tracked task T-ORG in
# docs/dev-notes/stage2-cloud/phase0/questions-and-concerns.md). Update these,
# the git remote, badges, and the PyPI trusted-publisher config in one sweep then.
[project.urls]
Homepage = "https://github.com/nagaraju-oruganti/sakrit"
Documentation = "https://github.com/nagaraju-oruganti/sakrit#readme"
Issues = "https://github.com/nagaraju-oruganti/sakrit/issues"
Source = "https://github.com/nagaraju-oruganti/sakrit"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10",
]

[tool.hatch.version]
path = "src/sakrit/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sakrit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: a typo'd marker (e.g. -m "choas") is an error, not a silent zero-select that
# would quietly drop tests from the chaos merge gate.
addopts = "-ra --strict-markers"
markers = [
    "integration: touches real I/O (sqlite/postgres); slower",
    "chaos: Act III kill-at-every-boundary suite",
    "corpus: runs the doctor over pinned real OSS repos (needs network; opt-in)",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py310"
# Keep ruff away from the docs site: it format-checks Python inside Markdown fenced blocks and
# would rewrite the mkdocs snippet directive `--8<--` into `--8 < --`, silently breaking the
# quickstart includes. The docs are prose + embedded (already-formatted) example files.
extend-exclude = ["docs-site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
strict = true
# Integration tests drive a third-party framework dynamically (LangGraph's
# heavily-overloaded invoke); chaos tests drive subprocesses + a durable fake
# world. Neither is worth fighting under strict mode; both are verified by running.
exclude = ["tests/integration/", "tests/chaos/", "tests/corpus/"]

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true
