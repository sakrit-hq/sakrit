name: Bug report
description: Something behaves incorrectly — especially a duplicate or lost effect.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Sakrit's whole job is to be *never silent, never dishonest* about
        effects, so a **silent duplicate or a lost effect is our highest-severity class** — if
        that's what you're seeing, please say so up front.

        If this is a security vulnerability, **do not file it here** — use private reporting
        (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
      placeholder: "An effect fired twice after a crash/resume; I expected it to fire once."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        The smallest code that shows it. A failing test cell in the style of `tests/chaos/`
        (a kill at a specific boundary) is ideal and gets fixed fastest.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sakrit version / commit
      placeholder: "0.1.0 (or a commit sha)"
    validations:
      required: true
  - type: dropdown
    id: ladder-level
    attributes:
      label: Provider ladder level (if known)
      description: The declared level of the effect involved, if relevant.
      options: ["unknown", "L0", "L1", "L2", "L2+R", "L3"]
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, adapter (LangGraph / OpenAI Agents / plain), ledger backend.
      placeholder: "macOS 15, Python 3.12, LangGraph adapter, SqliteLedger (file, WAL)"
    validations:
      required: true
