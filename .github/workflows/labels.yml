name: Sync labels

# Applies .github/labels.yml to the repository's labels. Run on demand (and whenever the
# manifest changes on main). Prepared in Phase 0 so the launch-day issue spike lands on a
# ready-made triage vocabulary rather than being sorted by hand.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels from manifest
        uses: micnncim/action-label-syncer@v1
        with:
          manifest: .github/labels.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
