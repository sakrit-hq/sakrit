name: Sync labels

# Applies .github/labels.yml to the repository's labels. Run on demand (and whenever the
# manifest changes on main). Prepared in Phase 0 so the launch-day issue spike lands on a
# ready-made triage vocabulary rather than being sorted by hand.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No third-party action (m13: the old label-syncer is archived). Sync via the gh CLI, which
      # is preinstalled on the runner — `gh label create --force` creates or updates each label.
      - name: Sync labels from manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import subprocess, sys
          try:
              import yaml
          except ImportError:
              subprocess.run([sys.executable, "-m", "pip", "install", "-q", "pyyaml"], check=True)
              import yaml
          for lbl in yaml.safe_load(open(".github/labels.yml")):
              subprocess.run(
                  ["gh", "label", "create", lbl["name"],
                   "--color", lbl["color"].lstrip("#"),
                   "--description", lbl.get("description", ""), "--force"],
                  check=True,
              )
          PY
