name: Chaos

# Act III kill-at-every-boundary suite. Runs on a schedule (not per-PR) because
# it is slow and destructive by design, and its results are a credibility
# artifact we publish. Also runnable on demand.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

jobs:
  chaos:
    name: exactly-once under crashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Pytest (chaos)
        run: uv run pytest tests/chaos -m chaos
